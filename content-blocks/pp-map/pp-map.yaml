handle: pp-map
name: Carte
icon: icon-map-marker
group: media
version: 1
settings: true
fields:
    center:
        translatable: false
        label: Centre
        type: text
        commentAbove: Latitude, Longitude  — example "52.520008, 13.404954".
    zoom:
        label: Zoom
        type: dropdown
        options:
            '5': 5 (Pays)
            '9': 9 (Région)
            '11': 11 (Ville)
            '13': 13 (Quartier)
            '15': 15 (Rue)
            '17': 17 (Bâtiment)
        default: '13'
    ratio:
        label: Ratio de la carte
        type: dropdown
        options:
            1x1: Carré
            4x3: 4/3
            16x9: 16/9
            21x9: Panoramique
        default: '4x3'

    markers:
        label: Marqueurs
        type: repeater
        titleFrom: label
        fields:
            lat:
                translatable: false
                label: Latitude
                type: text
            lng:
                translatable: false
                label: Longitude
                type: text
            popup:
                label: Popup
                type: textarea
    allow_move:
        label: Permettre de se déplacer sur la carte
        type: switch
        default: true
    allow_fullscreen:
        label: Permettre l'affichage plein écran
        type: switch
        default: true