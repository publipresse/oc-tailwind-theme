# Info banner — a Bootstrap-alert-style callout with four levels (grey /
# success / warning / danger), a level-matched icon and optional attention
# animations (accent-bar glow on all levels, icon pulse on warning/danger,
# a one-time shake when a danger banner scrolls into view). All animations
# respect prefers-reduced-motion.
handle: info-banner
name: 'renick.content::lang.block.info-banner.name'
icon: icon-warning
group: components
version: 1
settings: true
fields:
  level:
    label: 'renick.content::lang.block.info-banner.level'
    type: dropdown
    options:
      secondary: 'renick.content::lang.block.info-banner.level_opt_secondary'
      success: 'renick.content::lang.block.info-banner.level_opt_success'
      warning: 'renick.content::lang.block.info-banner.level_opt_warning'
      danger: 'renick.content::lang.block.info-banner.level_opt_danger'
    default: secondary
  title:
    label: 'renick.content::lang.block.info-banner.title'
    type: text
  text:
    label: 'renick.content::lang.block.info-banner.text'
    type: textarea
  animated:
    label: 'renick.content::lang.block.info-banner.animated'
    type: dropdown
    options:
      'yes': 'renick.content::lang.block.info-banner.animated_opt_yes'
      'no': 'renick.content::lang.block.info-banner.animated_opt_no'
    default: 'yes'
