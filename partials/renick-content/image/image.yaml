handle: image
name: 'renick.content::lang.block.image.name'
icon: icon-image
group: media
version: 1
settings: true
fields:
  image:
    label: 'renick.content::lang.block.image.image'
    type: mediafinder
    mode: image
    maxItems: 1
  alt:
    label: 'renick.content::lang.block.image.alt'
    type: text
  caption:
    label: 'renick.content::lang.block.image.caption'
    type: text
  aspect:
    label: 'renick.content::lang.block.image.aspect'
    type: dropdown
    options:
      '': 'renick.content::lang.block.image.aspect_opt_empty'
      1x1: 'renick.content::lang.block.image.aspect_opt_1x1'
      4x3: 'renick.content::lang.block.image.aspect_opt_4x3'
      16x9: 'renick.content::lang.block.image.aspect_opt_16x9'
      21x9: 'renick.content::lang.block.image.aspect_opt_21x9'
    default: ''
  fit:
    label: 'renick.content::lang.block.image.fit'
    type: dropdown
    options:
      cover: 'renick.content::lang.block.image.fit_opt_cover'
      contain: 'renick.content::lang.block.image.fit_opt_contain'
    default: cover
    commentAbove: 'renick.content::lang.block.image.fit_comment'
  focus:
    label: 'renick.content::lang.block.image.focus'
    type: dropdown
    options:
      '': 'renick.content::lang.block.image.focus_opt_empty'
      top: 'renick.content::lang.block.image.focus_opt_top'
      bottom: 'renick.content::lang.block.image.focus_opt_bottom'
      left: 'renick.content::lang.block.image.focus_opt_left'
      right: 'renick.content::lang.block.image.focus_opt_right'
      top-left: 'renick.content::lang.block.image.focus_opt_top_left'
      top-right: 'renick.content::lang.block.image.focus_opt_top_right'
      bottom-left: 'renick.content::lang.block.image.focus_opt_bottom_left'
      bottom-right: 'renick.content::lang.block.image.focus_opt_bottom_right'
    default: ''
    commentAbove: 'renick.content::lang.block.image.focus_comment'
