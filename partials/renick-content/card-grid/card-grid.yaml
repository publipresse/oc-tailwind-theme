# Card Grid — a Grid rendered in a card design. Structurally identical to Grid
# (a Bootstrap .row of Column blocks), so allowChildren is [column] — the SAME
# membership as grid, which lets the tree's drag-and-drop move Column blocks
# freely BETWEEN a grid and a card-grid (owner request). The card look is pure
# CSS on .rc-card-grid .rc-column (preview-default.css); the Column block is
# untouched.
handle: card-grid
name: 'renick.content::lang.block.card-grid.name'
icon: icon-th-large
group: layout
version: 1
settings: true
container: true
allowChildren:
  - column
fields:
  equal_height:
    label: 'renick.content::lang.block.card-grid.equal_height'
    type: dropdown
    options:
      '': 'renick.content::lang.block.card-grid.equal_height_opt_empty'
      'yes': 'renick.content::lang.block.card-grid.equal_height_opt_yes'
    default: ''
  centering:
    label: 'renick.content::lang.block.card-grid.centering'
    type: dropdown
    options:
      '': 'renick.content::lang.block.card-grid.centering_opt_empty'
      'yes': 'renick.content::lang.block.card-grid.centering_opt_yes'
    default: ''
