# Slider — Splide-powered carousel (ported from the renick-blocs theme, which
# shipped Splide for exactly this). One block covers all three legacy shapes:
#   • Carousel / image slider: per_page 1, Slide children with an image
#   • Card slider: per_page 2-4 + card_style yes, Slides with content children
# The bundled frontend JS (slider.ts) mounts every [data-rc-splide] element;
# the editor preview has no JS, so slides simply stack there (preview CSS).
handle: slider
name: 'renick.content::lang.block.slider.name'
icon: icon-exchange
group: media
version: 1
settings: true
container: true
allowChildren:
  - slide
fields:
  per_page:
    label: 'renick.content::lang.block.slider.per_page'
    type: dropdown
    options:
      '1': 'renick.content::lang.block.slider.per_page_opt_1'
      '2': 'renick.content::lang.block.slider.per_page_opt_2'
      '3': 'renick.content::lang.block.slider.per_page_opt_3'
      '4': 'renick.content::lang.block.slider.per_page_opt_4'
    default: '1'
  type:
    label: 'renick.content::lang.block.slider.type'
    type: dropdown
    options:
      slide: 'renick.content::lang.block.slider.type_opt_slide'
      loop: 'renick.content::lang.block.slider.type_opt_loop'
      fade: 'renick.content::lang.block.slider.type_opt_fade'
    default: loop
  autoplay:
    label: 'renick.content::lang.block.slider.autoplay'
    type: dropdown
    options:
      '': 'renick.content::lang.block.slider.autoplay_opt_empty'
      'yes': 'renick.content::lang.block.slider.autoplay_opt_yes'
    default: ''
  arrows:
    label: 'renick.content::lang.block.slider.arrows'
    type: dropdown
    options:
      '': 'renick.content::lang.block.slider.arrows_opt_empty'
      'no': 'renick.content::lang.block.slider.arrows_opt_no'
    default: ''
  pagination:
    label: 'renick.content::lang.block.slider.pagination'
    type: dropdown
    options:
      '': 'renick.content::lang.block.slider.pagination_opt_empty'
      'no': 'renick.content::lang.block.slider.pagination_opt_no'
    default: ''
  card_style:
    label: 'renick.content::lang.block.slider.card_style'
    type: dropdown
    options:
      '': 'renick.content::lang.block.slider.card_style_opt_empty'
      'yes': 'renick.content::lang.block.slider.card_style_opt_yes'
    default: ''
