# Timeline Item — one station on a Timeline. The marker shows a Lucide icon
# (rc_icon; same names as the editor icon set) or a plain dot without one.
handle: timeline-item
name: 'renick.content::lang.block.timeline-item.name'
icon: icon-circle-o
group: components
version: 1
settings: true
container: true
childOnly: true
fields:
  title:
    label: 'renick.content::lang.block.timeline-item.title'
    type: text
  meta:
    label: 'renick.content::lang.block.timeline-item.meta'
    type: text
    commentAbove: 'renick.content::lang.block.timeline-item.meta_comment'
  icon:
    label: 'renick.content::lang.block.timeline-item.icon'
    type: iconpicker
    commentAbove: 'renick.content::lang.block.timeline-item.icon_comment'
