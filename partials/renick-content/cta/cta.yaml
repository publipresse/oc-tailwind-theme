# Call to Action — five ready-made designs (superset of the renick-blocs cta
# variants minimalistic/bookmark/cover):
#   hero        — centered title/text/buttons, optional cover background image
#   hero-split  — text + buttons left, image right
#   panel       — colored band, title left / button right (blocs "cover")
#   minimal     — slim bordered card with an inline arrow link (blocs "minimalistic")
#   bookmark    — thumbnail card with title, footnote and button (blocs "bookmark")
handle: cta
name: 'renick.content::lang.block.cta.name'
icon: icon-bullhorn
group: components
version: 1
settings: true
fields:
  variant:
    label: 'renick.content::lang.block.cta.variant'
    type: dropdown
    options:
      hero: 'renick.content::lang.block.cta.variant_opt_hero'
      hero-split: 'renick.content::lang.block.cta.variant_opt_hero_split'
      panel: 'renick.content::lang.block.cta.variant_opt_panel'
      minimal: 'renick.content::lang.block.cta.variant_opt_minimal'
      bookmark: 'renick.content::lang.block.cta.variant_opt_bookmark'
    default: hero
  title:
    label: 'renick.content::lang.block.cta.title'
    type: text
  text:
    label: 'renick.content::lang.block.cta.text'
    type: textarea
    size: small
  image:
    label: 'renick.content::lang.block.cta.image'
    type: mediafinder
    mode: image
    maxItems: 1
    commentAbove: 'renick.content::lang.block.cta.image_comment'
  footnote:
    label: 'renick.content::lang.block.cta.footnote'
    type: text
    commentAbove: 'renick.content::lang.block.cta.footnote_comment'
  button_label:
    label: 'renick.content::lang.block.cta.button_label'
    type: text
  button_url:
    label: 'renick.content::lang.block.cta.button_url'
    type: text
  button_style:
    label: 'renick.content::lang.block.cta.button_style'
    type: dropdown
    options:
      primary: 'renick.content::lang.block.cta.button_style_opt_primary'
      secondary: 'renick.content::lang.block.cta.button_style_opt_secondary'
      light: 'renick.content::lang.block.cta.button_style_opt_light'
      dark: 'renick.content::lang.block.cta.button_style_opt_dark'
      outline-primary: 'renick.content::lang.block.cta.button_style_opt_outline_primary'
      outline-light: 'renick.content::lang.block.cta.button_style_opt_outline_light'
    default: primary
  second_label:
    label: 'renick.content::lang.block.cta.second_label'
    type: text
  second_url:
    label: 'renick.content::lang.block.cta.second_url'
    type: text
