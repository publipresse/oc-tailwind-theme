# Column — one cell of a Grid row (plan/05 rev 2026-07-10, owner request).
# Width follows the Bootstrap 12-column model: a fixed 1–12 share, or Auto —
# auto columns split the remaining space equally, exactly like `.col` next
# to `.col-6`. Only insertable inside a Grid (childOnly).
