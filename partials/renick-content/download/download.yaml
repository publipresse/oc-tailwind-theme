# Download — a list of file boxes: type icon, title (file name fallback),
# size (rc_filesize) and a download affordance. Files come from the media
# library; the label is optional per row.
handle: download
name: 'renick.content::lang.block.download.name'
icon: icon-download
group: media
version: 1
settings: true
fields:
  files:
    label: 'renick.content::lang.block.download.files'
    type: repeater
    titleFrom: label
    fields:
      file:
        label: 'renick.content::lang.block.download.files_file'
        type: mediafinder
        mode: file
      label:
        label: 'renick.content::lang.block.download.files_label'
        type: text
        commentAbove: 'renick.content::lang.block.download.files_label_comment'
