{# Gallery — blocs-theme port. Three variants: `simple` (plain lightbox thumb
   + <figcaption>), `labels` (title overlay on the thumb), `cards` (thumb +
   title in a card). NO lightbox JS is bundled: themes are expected to
   initialise their own (e.g. GLightbox) on the `.gallery-lightbox` anchors /
   data-glightbox attrs, exactly like the legacy renick-blocs theme did.

   images is a REPEATER of { image, alt, caption } rows. Two legacy shapes are
   still rendered, decided PER ITEM so a mixed document degrades gracefully:
     • a plain path STRING (seeds ship arrays of these) — optionally with the
       "path | title" pipe form the old textarea produced,
     • the whole field as a newline/comma string of such lines.
   alt drives the lightbox label and the <img alt>; caption is the visible
   description (<figcaption>, card body or overlay). Both are autoescaped.

   The variant is re-whitelisted here (buildAttributes validates it for the
   root class) because the template branches on it — raw data must never pick
   a branch or reach markup unvalidated. #}
{% set variant = (data.variant in ['labels', 'cards']) ? data.variant : 'simple' %}

{# Per-breakpoint column shares (12-col model, like blocs size_min/med/max).
   Values are validated 1..12; anything else falls back to the field defaults
   so a hand-edited document cannot inject classes. rc-col-{desktop} mirrors
   the `column` block so the bundled preview grid works without Bootstrap. #}
{% set cols_m = (data.cols_mobile|default('12')) ~ '' %}
{% set cols_m = (cols_m matches '/^([1-9]|1[0-2])$/') ? cols_m : '12' %}
{% set cols_t = (data.cols_tablet|default('6')) ~ '' %}
{% set cols_t = (cols_t matches '/^([1-9]|1[0-2])$/') ? cols_t : '6' %}
{% set cols_d = (data.cols_desktop|default('4')) ~ '' %}
{% set cols_d = (cols_d matches '/^([1-9]|1[0-2])$/') ? cols_d : '4' %}

{# Thumb crop size: positive pixel counts only, else the blocs defaults. #}
{% set thumb_w = (data.thumb_width|default('420')) ~ '' %}
{% set thumb_w = (thumb_w matches '/^[1-9]\\d{0,3}$/') ? thumb_w : '420' %}
{% set thumb_h = (data.thumb_height|default('220')) ~ '' %}
{% set thumb_h = (thumb_h matches '/^[1-9]\\d{0,3}$/') ? thumb_h : '220' %}

{# An iterable field is a repeater (or a legacy array of path strings); a bare
   string is the old textarea — split it into lines to iterate uniformly. #}
{% set items = data.images is iterable ? data.images : (data.images|default('')|replace({',': "\n"})|split("\n")) %}
<div {{ attributes|raw }}>
    <div class="row rc-row">
        {% for item in items %}
            {# Normalise each item to { path, alt, caption }. A mapping is a
               repeater row; a string is a path (with the optional "path | title"
               legacy pipe form). #}
            {% if item is iterable %}
                {% set path = (item.image|default(''))|trim %}
                {% set alt = (item.alt|default(''))|trim %}
                {% set caption = (item.caption|default(''))|trim %}
            {% else %}
                {% set parts = (item ~ '')|split('|', 2) %}
                {% set path = parts[0]|trim %}
                {% set alt = parts[1] is defined ? parts[1]|trim : '' %}
                {% set caption = '' %}
            {% endif %}
            {# Legacy "show file names" toggle still fills an empty alt from the
               file name so untitled thumbs keep a caption. #}
            {% if alt == '' and data.captions|default('hide') == 'show' %}
                {% set alt = path|split('/')|last %}
            {% endif %}
            {% if path %}
                {% set full = path|media %}
                {# Cropped thumbs à la blocs: a WebP variant plus a JPG fallback.
                   rc_resize degrades to the plain media URL when October's
                   resizer is unavailable — then both are identical and the
                   WebP <source> is skipped (its type claim would be a lie). #}
                {% set thumb = path|rc_resize(thumb_w, thumb_h, {mode: 'crop', extension: 'jpg'}) %}
                {% set thumb_webp = path|rc_resize(thumb_w, thumb_h, {mode: 'crop', extension: 'webp'}) %}
                {# The lightbox label prefers the caption, then the alt text. #}
                {% set lightbox_title = caption != '' ? caption : alt %}
                {# figure (not div) so the simple variant's <figcaption> stays valid HTML #}
                <figure class="col-{{ cols_m }} col-md-{{ cols_t }} col-lg-{{ cols_d }} rc-col-{{ cols_d }} rc-gallery-item">
                    {# Untitled images would leave the link without an accessible
                       name (the thumb's alt is the title) — fall back to a
                       positional label so every lightbox link is discernible. #}
                    <a href="{{ full }}"
                       class="rc-gallery-lightbox gallery-lightbox"
                       data-glightbox="title: {{ lightbox_title }}"{% if not lightbox_title %} aria-label="{{ rc_t('block.front.gallery_view_image', {'index': loop.index, 'total': items|length}, locale) }}"{% endif %}>
                        {% if variant == 'cards' %}<div class="card h-100 rc-gallery-card">{% endif %}
                        <picture>
                            {% if thumb_webp and thumb_webp != thumb %}<source srcset="{{ thumb_webp }}" type="image/webp">{% endif %}
                            <img src="{{ thumb }}" alt="{{ alt }}" width="{{ thumb_w }}" height="{{ thumb_h }}" loading="lazy" class="rc-gallery-thumb">
                        </picture>
                        {% if variant == 'labels' and alt %}<div class="rc-gallery-label label">{{ alt }}</div>{% endif %}
                        {% if variant == 'cards' %}{% if alt or caption %}<div class="card-body">{% if alt %}<div class="rc-gallery-card-title">{{ alt }}</div>{% endif %}{% if caption %}<div class="rc-gallery-card-text">{{ caption }}</div>{% endif %}</div>{% endif %}</div>{% endif %}
                    </a>
                    {% if variant == 'simple' and (caption or alt) %}<figcaption>{{ caption != '' ? caption : alt }}</figcaption>{% endif %}
                </figure>
            {% endif %}
        {% endfor %}
    </div>
</div>
