# Gallery — blocs-theme port (simple / labels / cards variants).
# Layout follows the Bootstrap 12-column model per breakpoint, exactly like
# the legacy renick-blocs gallery (size_min/med/max there). Thumbs are
# cropped server-side via rc_resize so grids stay uniform without CSS hacks.
handle: gallery
name: 'renick.content::lang.block.gallery.name'
icon: icon-picture-o
group: media
version: 1
settings: true
fields:
  images:
    label: 'renick.content::lang.block.gallery.images'
    type: repeater
    titleFrom: alt
    maxItems: 24
    commentAbove: 'renick.content::lang.block.gallery.images_comment'
    fields:
      image:
        label: 'renick.content::lang.block.gallery.images_image'
        type: mediafinder
        mode: image
        maxItems: 1
      alt:
        label: 'renick.content::lang.block.gallery.images_alt'
        type: text
      caption:
        label: 'renick.content::lang.block.gallery.images_caption'
        type: text
  captions:
    label: 'renick.content::lang.block.gallery.captions'
    type: dropdown
    options:
      hide: 'renick.content::lang.block.gallery.captions_opt_hide'
      show: 'renick.content::lang.block.gallery.captions_opt_show'
    default: hide
  variant:
    label: 'renick.content::lang.block.gallery.variant'
    type: dropdown
    options:
      simple: 'renick.content::lang.block.gallery.variant_opt_simple'
      labels: 'renick.content::lang.block.gallery.variant_opt_labels'
      cards: 'renick.content::lang.block.gallery.variant_opt_cards'
    default: simple
  cols_mobile:
    label: 'renick.content::lang.block.gallery.cols_mobile'
    type: dropdown
    options:
      '1': 'renick.content::lang.block.gallery.cols_mobile_opt_1'
      '2': 'renick.content::lang.block.gallery.cols_mobile_opt_2'
      '3': 'renick.content::lang.block.gallery.cols_mobile_opt_3'
      '4': 'renick.content::lang.block.gallery.cols_mobile_opt_4'
      '5': 'renick.content::lang.block.gallery.cols_mobile_opt_5'
      '6': 'renick.content::lang.block.gallery.cols_mobile_opt_6'
      '7': 'renick.content::lang.block.gallery.cols_mobile_opt_7'
      '8': 'renick.content::lang.block.gallery.cols_mobile_opt_8'
      '9': 'renick.content::lang.block.gallery.cols_mobile_opt_9'
      '10': 'renick.content::lang.block.gallery.cols_mobile_opt_10'
      '11': 'renick.content::lang.block.gallery.cols_mobile_opt_11'
      '12': 'renick.content::lang.block.gallery.cols_mobile_opt_12'
    default: '12'
  cols_tablet:
    label: 'renick.content::lang.block.gallery.cols_tablet'
    type: dropdown
    options:
      '1': 'renick.content::lang.block.gallery.cols_tablet_opt_1'
      '2': 'renick.content::lang.block.gallery.cols_tablet_opt_2'
      '3': 'renick.content::lang.block.gallery.cols_tablet_opt_3'
      '4': 'renick.content::lang.block.gallery.cols_tablet_opt_4'
      '5': 'renick.content::lang.block.gallery.cols_tablet_opt_5'
      '6': 'renick.content::lang.block.gallery.cols_tablet_opt_6'
      '7': 'renick.content::lang.block.gallery.cols_tablet_opt_7'
      '8': 'renick.content::lang.block.gallery.cols_tablet_opt_8'
      '9': 'renick.content::lang.block.gallery.cols_tablet_opt_9'
      '10': 'renick.content::lang.block.gallery.cols_tablet_opt_10'
      '11': 'renick.content::lang.block.gallery.cols_tablet_opt_11'
      '12': 'renick.content::lang.block.gallery.cols_tablet_opt_12'
    default: '6'
  cols_desktop:
    label: 'renick.content::lang.block.gallery.cols_desktop'
    type: dropdown
    options:
      '1': 'renick.content::lang.block.gallery.cols_desktop_opt_1'
      '2': 'renick.content::lang.block.gallery.cols_desktop_opt_2'
      '3': 'renick.content::lang.block.gallery.cols_desktop_opt_3'
      '4': 'renick.content::lang.block.gallery.cols_desktop_opt_4'
      '5': 'renick.content::lang.block.gallery.cols_desktop_opt_5'
      '6': 'renick.content::lang.block.gallery.cols_desktop_opt_6'
      '7': 'renick.content::lang.block.gallery.cols_desktop_opt_7'
      '8': 'renick.content::lang.block.gallery.cols_desktop_opt_8'
      '9': 'renick.content::lang.block.gallery.cols_desktop_opt_9'
      '10': 'renick.content::lang.block.gallery.cols_desktop_opt_10'
      '11': 'renick.content::lang.block.gallery.cols_desktop_opt_11'
      '12': 'renick.content::lang.block.gallery.cols_desktop_opt_12'
    default: '4'
  thumb_width:
    label: 'renick.content::lang.block.gallery.thumb_width'
    type: text
    default: '420'
  thumb_height:
    label: 'renick.content::lang.block.gallery.thumb_height'
    type: text
    default: '220'
