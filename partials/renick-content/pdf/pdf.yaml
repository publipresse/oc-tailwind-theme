# PDF — embeds a PDF from the media library with an inline pdf.js viewer
# (Mozilla pdf.js, bundled from npm; loaded lazily only when a pdf block is on
# the page). Without JavaScript — and in the editor preview — the block shows
# the download card fallback instead.
handle: pdf
name: 'renick.content::lang.block.pdf.name'
icon: icon-file-pdf-o
group: media
version: 1
settings: true
fields:
  file:
    label: 'renick.content::lang.block.pdf.file'
    type: mediafinder
    mode: file
    maxItems: 1
  title:
    label: 'renick.content::lang.block.pdf.title'
    type: text
    commentAbove: 'renick.content::lang.block.pdf.title_comment'
