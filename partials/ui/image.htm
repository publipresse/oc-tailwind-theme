{%
    props {
        id: null,
        class: null,
        src: null,
        width: null,
        height: null,
        mode: 'crop',
        alt: null,
        loading: 'lazy',
    }
%}

{% set src = src|default('assets/img/dummy.jpg'|theme) %}

<img
    {{
        attributes.merge({
            id: id,
            class: class,
            src: src|resize(width, height, mode),
            alt: alt,
            loading: loading,
        })
    }} 
/>
